# ===========================================================================
hub:
  headline_kpis_from: einstieg-title-overview
  tagline: "Abwanderungsanalyse für einen Markteintritt in Florida"
  subtitle: "Data-Analysis-Projekt"
  footer_tagline: "Telekommunikation · Abwanderung · Zielgruppenbestimmung"
  about:
    - label: "Motivation"
      text: "Teleconfia testet den US-Markt mit Florida als Pilotregion. Neukunden bekamen das erste Jahr vergünstigt, nicht alle sind geblieben. Zwei Kampagnen sollen dagegenhalten und brauchen konkrete Adressaten."
    - label: "Kernfrage"
      text: "Welche Spalten zeigen tatsächlich ein Abwanderungsrisiko, und wo setzt man die Schwelle für eine Kontaktaufnahme? <strong>Drei Indikatoren reichen</strong> — internationaler Tarif (42,4 % gegen 11,5 %), vier oder mehr Service-Anrufe (45,8 % gegen rund 10 %) und eine per Regression bestimmte Schwelle bei 350,74 Tagesminuten."
    - label: "Datenqualität"
      text: "Die Prüfung der Rohdaten fand 37 Zeilen mit negativem Anrufzähler, ein unmöglicher Wert für einen Zähler und in der ursprünglichen Musterlösung unentdeckt. Er verschiebt genau den Indikator, auf dem eine der Empfehlungen beruht."
    - label: "Ergebnis & Grenzen"
      text: "954 von 3.333 Kunden lösen mindestens ein Risikosignal aus, vier von zwölf Stadtteilen tragen 60,9 % der Abwanderung. Bewusst ohne Vorhersagemodell und ohne Train/Test-Split — die Schwelle bei 350,74 Minuten ist sauber hergeleitet, trifft allein aber nur vier Kunden und taugt nur als Zusatzkriterium."
  quick_links:
    - {href: "https://github.com/kaywiegand/telefonica-churn/tree/main/notebooks", label: "Notebooks"}
  view_order: [overview, techview, storyview]
  # Kartentexte kommen aus DEFAULT_VIEW_CARDS im Skill. Hier nur Abweichungen.
  view_cards:
    techview:
      description: "Technischer Deep-Dive für Data Scientists. Datenbereinigung, Indikatortypen, Schwellenwert-Herleitung und Aussagegrenzen im Detail."

view_composition:
  overview:
    - einstieg
    - problem
    - analyse
    - findings
    - empfehlungen
    - ende

  storyview:
    - einstieg
    - problem
    - daten
    - exploration
    - analyse
    - findings
    - empfehlungen
    - grenzen
    - ende

  # TechView folgt dem Bauweg (Portfolio-Standard, siehe project-case.md):
  # Ausgangssituation -> Daten -> Exploration -> Analyse -> Methodik -> Grenzen
  techview:
    - einstieg
    - problem
    - daten
    - exploration
    - analyse
    - methodik
    - grenzen
    - ende
