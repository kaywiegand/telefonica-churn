# Slide-Registry — Single Source of Truth für Overview/StoryView/TechView
#
# Schema wie zh-tram-flow / us-used-vehicle-resales: chapters -> slides -> content-items.
# View-Rollen (Kay 27.08.2026): Overview = kürzeste Business-Sicht, StoryView = vollständigste
# Erzählung, TechView = rein technische Themen (Datenbereinigung, Methodik, Grenzen) ohne
# Business-Empfehlungen.
#
# Content-Typen ohne Renderer (nicht verwenden): findings, note.

chapters:

  # ---------------------------------------------------------------------
  - id: einstieg
    nav_label: Einstieg
    slides:
      - id: einstieg-title-overview
        views: [overview]
        role: title
        layout: L6
        title: "Telefonica Churn"
        subtitle:
          - "Abwanderungsanalyse für einen Markteintritt in Florida"
          - "Data-Analysis-Projekt | StackFuel Capstone"
        content:
          - type: figures
            items:
              - {value: "3.333", label: "Kunden im bereinigten Datensatz", sentiment: neutral}
              - {value: "14,49 %", label: "Basis-Abwanderungsrate", sentiment: warning}
              - {value: "954", label: "Kunden mit mindestens einem Risikosignal", sentiment: positive}

      - id: einstieg-title-storyview
        views: [storyview]
        role: title
        layout: L6
        title: "Telefonica Churn"
        subtitle:
          - "Abwanderungsanalyse für einen Markteintritt in Florida"
          - "Data-Analysis-Projekt | StackFuel Capstone"
        content:
          - type: figures
            items:
              - {value: "3.333", label: "Kunden (aus 3.349 Rohzeilen)", sentiment: neutral}
              - {value: "14,49 %", label: "Basis-Abwanderungsrate", sentiment: warning}
              - {value: "3", label: "unabhängig geprüfte Indikatoren", sentiment: neutral}
              - {value: "954", label: "Kunden für gezielte Ansprache", sentiment: positive}

      - id: einstieg-title-techview
        views: [techview]
        role: title
        layout: L6
        title: "Telefonica Churn"
        subtitle:
          - "Abwanderungsanalyse für einen Markteintritt in Florida"
          - "Data-Analysis-Projekt | StackFuel Capstone"
        content:
          - type: figures
            items:
              - {value: "37", label: "Zeilen mit negativem Anrufzähler", sentiment: negative}
              - {value: "350,74", label: "Minuten, 50-Prozent-Schwelle", sentiment: neutral}
              - {value: "0,052", label: "Pseudo-R² der Regression", sentiment: warning}
              - {value: "5", label: "nummerierte Notebooks, durchgehend reproduzierbar", sentiment: neutral}

      - id: einstieg-agenda-overview
        views: [overview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Ergebnis und Handlungsempfehlungen, ohne Methodik"
        content:
          - type: agenda
            items:
              - "Problem"
              - "Indikatoren"
              - "Ergebnis"
              - "Empfehlungen"

      - id: einstieg-agenda-storyview
        views: [storyview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Der komplette Weg von den Rohdaten zu den Kampagnen-Zielgruppen"
        content:
          - type: agenda
            items:
              - "Problem"
              - "Daten und Qualität"
              - "Exploration"
              - "Analyse"
              - "Ergebnis"
              - "Empfehlungen"
              - "Grenzen"

      - id: einstieg-agenda-techview
        views: [techview]
        layout: L6
        kicker: "Agenda"
        title: "Inhaltsübersicht"
        subtitle: "Datenaufbereitung, Indikatortypen und Methodik"
        content:
          - type: agenda
            items:
              - "Daten und Qualität"
              - "Indikatortypen"
              - "Methodik"
              - "Grenzen"

  # ---------------------------------------------------------------------
  - id: problem
    nav_label: Problem
    slides:
      - id: problem-szenario
        views: [overview, storyview, techview]
        layout: L6
        kicker: "Problem"
        title: "Markteintritt mit subventioniertem ersten Jahr"
        subtitle: "Teleconfia testet den US-Markt mit Florida als Pilotregion"
        content:
          - type: statement
            layout: lead_copy
            text: "Nicht alle Neukunden sind geblieben"
            copy: "Das erste Jahr war vergünstigt. Zwei Kampagnen sollen die Abwanderung bremsen, eine Plakatkampagne in den Stadtteilen mit der höchsten Abwanderung und eine persönliche Ansprache der Kunden, die vermutlich kündigen werden."
          - type: figures
            items:
              - {value: "14,49 %", label: "Abwanderung über alle Kunden", sentiment: warning}
              - {value: "3.333", label: "Kunden im Datensatz", sentiment: neutral}
              - {value: "12", label: "Stadtteile in Florida", sentiment: neutral}

      - id: problem-auftrag
        views: [storyview]
        layout: L6
        kicker: "Problem"
        title: "Die Leitfrage"
        subtitle: "Zielgruppen bestimmen, nicht eine Quote senken"
        content:
          - type: statement
            layout: wide
            text: "Der Auftrag nennt keine Zielquote, er fragt nach Adressaten. Welche Spalten zeigen ein Risiko, und wo liegt die Kontaktschwelle."
          - type: sections
            layout: columns
            numbered: true
            items:
              - label: "Plakatkampagne"
                points:
                  - "Zielgebiete sind Stadtteile, nicht einzelne Kunden."
                  - "Gesucht ist eine Rangfolge der zwölf Distrikte."
              - label: "Persönliche Ansprache"
                points:
                  - "Zielgruppe sind einzelne Kunden mit erkennbarem Risiko."
                  - "Gesucht sind Merkmale und eine Kontaktschwelle."

  # ---------------------------------------------------------------------
  - id: daten
    nav_label: Daten
    slides:
      - id: daten-quelle
        views: [storyview, techview]
        layout: wide
        kicker: "Daten"
        title: "Zwei Tabellen, ein Join"
        subtitle: "SQLite-Datenbank aus dem StackFuel-Abschlussprojekt"
        content:
          - type: comparison_table
            columns: ["Schritt", "Umfang", "Anmerkung"]
            rows:
              - cells: ["churn_data", "3.349 Zeilen × 17 Spalten", "eine Zeile je Kunde, Zielspalte churn"]
                highlight: false
              - cells: ["cities", "12 Zeilen", "Stadtteile, 1:1 über area_code"]
                highlight: false
              - cells: ["Join", "3.349 × 18", "local_area_code = cities.area_code"]
                highlight: false
              - cells: ["Bereinigt", "3.333 × 18", "16 vollständig leere Zeilen entfernt"]
                highlight: true
          - type: statement
            layout: wide
            text: "Querschnittsaufnahme ohne Datumsspalte. Jede Aussage bezieht sich auf einen Stand, nicht auf einen Verlauf."

      - id: daten-qualitaet
        views: [storyview, techview]
        layout: L6
        kicker: "Daten"
        title: "Ein Zähler, der nicht negativ sein kann"
        subtitle: "Was die Prüfung der Rohdaten zutage gefördert hat"
        content:
          - type: box_grid
            items:
              - text: "<strong>37 Zeilen mit negativem Anrufzähler</strong><br>customer_service_calls enthielt die Werte -1 und -2. Ein Zähler für getätigte Anrufe kann nicht negativ werden. Auf 0 gesetzt."
                highlight: true
              - text: "<strong>16 vollständig leere Zeilen</strong><br>Ohne jeden Wert, ersatzlos entfernt."
                highlight: false
              - text: "<strong>4 Spalten mit einzelnen Lücken</strong><br>number_vmail_messages, total_day_calls, total_eve_calls, total_night_calls. Aufgefüllt mit 0 oder Median, je nach fachlicher Bedeutung."
                highlight: false
          - type: statement
            layout: wide
            text: "Der negative Anrufzähler blieb in der Musterlösung unentdeckt. Er verschiebt genau den Indikator, auf dem eine der Empfehlungen beruht."

  # ---------------------------------------------------------------------
  - id: exploration
    nav_label: Exploration
    slides:
      - id: exploration-basis
        views: [storyview, techview]
        layout: L6
        kicker: "Exploration"
        title: "Die Ausgangslage"
        subtitle: "Was der Datensatz hergibt und was nicht"
        content:
          - type: figures
            items:
              - {value: "14,49 %", label: "Abwanderungsrate als Vergleichsmaßstab", sentiment: warning}
              - {value: "1 Zeile", label: "je Kunde, keine Verlaufsdaten", sentiment: neutral}
              - {value: "0", label: "Datumsspalten im Datensatz", sentiment: neutral}
          - type: statement
            layout: wide
            text: "Ohne Zeitachse kein Verlauf. Die Zielgruppenfrage wird damit zur Frage nach Merkmalen im Bestand, nicht nach einem Vorhersagemodell."

  # ---------------------------------------------------------------------
  - id: analyse
    nav_label: Analyse
    slides:
      - id: analyse-uebersicht
        views: [overview, storyview]
        layout: wide
        kicker: "Indikatoren"
        title: "Drei Signale, unabhängig geprüft"
        subtitle: "Jedes für sich gegen den gesamten Datensatz gerechnet"
        content:
          - type: comparison_table
            columns: ["Indikator", "Abwanderung", "Betroffene Kunden", "Eignung"]
            rows:
              - cells: ["Internationaler Tarif", "42,4 % gegen 11,5 %", "323", "stark"]
                highlight: true
              - cells: ["Ab 4 Service-Anrufen", "45,8 % gegen 10 bis 13,5 %", "696", "stark"]
                highlight: true
              - cells: ["Tagesminuten über 350,74", "50 % rechnerisch", "4", "nur ergänzend"]
                highlight: false
          - type: statement
            layout: wide
            text: "Zwei Indikatoren tragen eine Kampagne. Der dritte ist sauber hergeleitet und trifft trotzdem zu wenige Kunden, um allein zu stehen."

      - id: analyse-staedte
        views: [storyview]
        kicker: "Analyse"
        title: "Vier Stadtteile tragen die Mehrheit"
        subtitle: "Zielgebiete für die Plakatkampagne"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - source: "city_churn_ranking.png"
                label: "Stadtteile nach Abwanderung"
                caption: "Vier von zwölf Stadtteilen tragen 60,9 Prozent aller Abwanderungen.<br><br>Jacksonville 29,82 %, Orlando1 23,67 %, Cape Coral 21,78 %, Orlando2 19,08 %. Das reicht als Zielgebiet für die Plakatkampagne."

      - id: analyse-international
        views: [storyview, techview]
        kicker: "Analyse"
        title: "Der internationale Tarif"
        subtitle: "Das stärkste kategoriale Signal"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - source: "international_plan_churn.png"
                label: "Abwanderung nach Tarif"
                caption: "42,4 % gegen 11,5 %, knapp das Vierfache.<br><br>Betrifft 323 Kunden. Klein genug, um sie einzeln anzusprechen."

      - id: analyse-servicecalls
        views: [storyview, techview]
        kicker: "Analyse"
        title: "Der vierte Anruf"
        subtitle: "Ein klarer Knick statt eines gleichmäßigen Anstiegs"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - source: "customer_service_calls_churn.png"
                label: "Abwanderung nach Service-Anrufen"
                caption: "Bis zum dritten Anruf zwischen 10,2 und 13,5 %, beim vierten 45,8 %.<br><br>Kontaktschwelle deshalb bei drei Anrufen, vor dem Knick. Betrifft 696 Kunden."

      - id: analyse-logreg
        views: [storyview, techview]
        kicker: "Analyse"
        title: "Eine Schwelle statt einer Faustregel"
        subtitle: "Logistische Regression auf den Tagesminuten"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - source: "logit_total_day_minutes.png"
                label: "Regressionskurve mit Schwelle"
                caption: "Die Schwelle ist gerechnet, nicht geschätzt.<br><br>Bei 350,74 Tagesminuten liegt die Abwanderungswahrscheinlichkeit bei 50 %. Sauber hergeleitet, aber nur vier Kunden liegen darüber."

      - id: analyse-typen
        views: [techview]
        layout: wide
        kicker: "Indikatortypen"
        title: "Drei Datentypen, drei Auswertungswege"
        subtitle: "Warum nicht jede Spalte gleich behandelt wird"
        content:
          - type: comparison_table
            columns: ["Typ", "Spalte", "Verfahren", "Ergebnis"]
            rows:
              - cells: ["kategorial", "international_plan", "Gruppenvergleich der Raten", "42,4 % gegen 11,5 %"]
                highlight: false
              - cells: ["ganzzahlig", "customer_service_calls", "Rate je Ausprägung, Knick suchen", "Sprung beim 4. Anruf"]
                highlight: false
              - cells: ["stetig", "total_day_minutes", "logistische Regression, 50-Prozent-Punkt", "350,74 Minuten"]
                highlight: true
          - type: statement
            layout: wide
            text: "Eine stetige Größe hat keine natürlichen Gruppen. Eine Schwelle per Augenmaß wäre willkürlich, deshalb hier die Regression."

  # ---------------------------------------------------------------------
  - id: methodik
    nav_label: Methodik
    slides:
      - id: methodik-logreg
        views: [techview]
        kicker: "Methodik"
        title: "Die Regression im Detail"
        subtitle: "statsmodels Logit auf total_day_minutes"
        content:
          - type: chart_refs
            layout: image_left
            items:
              - source: "logit_total_day_minutes.png"
                label: "Regressionskurve mit Schwelle"
                caption: "Ein Prädiktor, gerechnet auf dem vollen Datensatz.<br><br>50-Prozent-Punkt bei 350,74 Minuten. Pseudo-R² 0,052 heißt zugleich, dass die Tagesminuten den Großteil der Abwanderung nicht erklären."

      - id: methodik-kein-split
        views: [techview]
        layout: L6
        kicker: "Methodik"
        title: "Bewusst ohne Train/Test-Split"
        subtitle: "Schwellenwert bestimmen statt generalisieren"
        content:
          - type: contrasts
            items:
              - topic: "Ziel der Regression"
                assumption: "Ein Modell, das Abwanderung bei unbekannten Kunden vorhersagt und dafür auf einem Testset bewertet wird."
                finding: "Eine belegbare Schwelle für die Kontaktliste, gerechnet auf dem vorhandenen Bestand."
          - type: statement
            layout: wide
            text: "Ein Split würde die Datenbasis nur verkleinern, ohne die Aussage zu verbessern. Geprüft wird stattdessen die Datenqualität und wie viele Kunden ein Indikator trifft."

  # ---------------------------------------------------------------------
  - id: findings
    nav_label: Ergebnis
    slides:
      - id: findings-kombiniert
        views: [overview, storyview]
        layout: L6
        kicker: "Ergebnis"
        title: "Knapp ein Drittel der Kunden ist adressierbar"
        subtitle: "Abdeckung der drei Indikatoren zusammen"
        content:
          - type: figures
            items:
              - {value: "954", label: "von 3.333 Kunden mit mindestens einem Signal", sentiment: positive}
              - {value: "28,6 %", label: "Anteil am Bestand", sentiment: positive}
              - {value: "60,9 %", label: "der Abwanderung in vier Stadtteilen", sentiment: positive}
          - type: statement
            layout: wide
            text: "Beide Kampagnen haben eine konkrete Zielgruppe, ohne Vorhersagemodell."

  # ---------------------------------------------------------------------
  - id: empfehlungen
    nav_label: Empfehlungen
    slides:
      - id: empfehlungen-alle
        views: [overview, storyview]
        layout: wide
        kicker: "Empfehlungen"
        title: "Vier Maßnahmen"
        subtitle: "Direkt aus den drei Indikatoren abgeleitet"
        content:
          - type: recommendations
            items:
              - category: "1"
                title: "Plakatkampagne in den vier stärksten Stadtteilen"
                points:
                  - "Jacksonville, Orlando1, Cape Coral und Orlando2."
                  - "Zusammen 60,9 Prozent der gesamten Abwanderung."
              - category: "2"
                title: "Persönliche Ansprache bei internationalem Tarif"
                points:
                  - "323 Kunden bei 42,4 Prozent Abwanderung."
                  - "Bessere Konditionen für Auslandsgespräche anbieten, bevor sie kündigen."
              - category: "3"
                title: "Frühwarnung ab dem dritten Service-Anruf"
                points:
                  - "696 Kunden betroffen."
                  - "Beim vierten Anruf springt die Rate auf 45,8 Prozent, der Kontakt beim dritten schafft Vorlauf."
              - category: "4"
                title: "Tagesminuten nur als zusätzliches Kriterium"
                points:
                  - "Die Schwelle von 350,74 Minuten ist sauber hergeleitet."
                  - "Sie trifft allein aber nur vier Kunden, deshalb mit den beiden anderen kombinieren."

  # ---------------------------------------------------------------------
  - id: grenzen
    nav_label: Grenzen
    slides:
      - id: grenzen-alle
        views: [storyview, techview]
        layout: L6
        kicker: "Grenzen"
        title: "Was diese Analyse nicht kann"
        subtitle: "Aussagegrenzen, offen benannt"
        content:
          - type: box_grid
            items:
              - text: "<strong>Keine Generalisierung</strong><br>Ohne Train/Test-Split und ohne Vorhersagemodell gilt jede Aussage für diesen Bestand, nicht für künftige Kunden."
                highlight: false
              - text: "<strong>Die Tagesminuten-Schwelle steht allein zu dünn</strong><br>Statistisch sauber bei 350,74 Minuten, betrifft aber nur vier Kunden. Als alleiniges Kriterium unbrauchbar."
                highlight: true
              - text: "<strong>Keine Zeitachse</strong><br>Der Datensatz ist eine Querschnittsaufnahme. Wann eine Kündigung fällt und was ihr vorausging, lässt sich nicht rekonstruieren."
                highlight: false
              - text: "<strong>Wirkung ungemessen</strong><br>Ob die Kampagnen wirken, zeigt erst eine Nachmessung. Der Datensatz enthält keinen Vorher-Nachher-Vergleich."
                highlight: false

  # ---------------------------------------------------------------------
  - id: ende
    nav_label: Ende
    slides:
      # Eine gemeinsame Closing-Slide für alle drei Views (kein Drift zwischen den Views).
      # layout: split = Kopfzone wie die Titelslide, darunter zwei Spalten,
      # Text links, Links/Buttons rechts.
      - id: ende-closing
        views: [overview, storyview, techview]
        role: closing
        layout: split
        title: "Telefonica Churn"
        subtitle: "Abwanderungsanalyse für einen Markteintritt in Florida<br>Data-Analysis-Projekt | StackFuel Capstone"
        closing_primary_link:
          {label: "Notebooks durchsuchen", href: "https://github.com/kaywiegand/telefonica-churn/tree/main/notebooks", target: "_blank"}
        closing_extra_links:
          - {label: "LinkedIn-Profil", href: "https://www.linkedin.com/in/kaywiegand/", target: "_blank"}
        content:
          - type: statement
            layout: lead_copy
            text: "Sorgfalt schlägt Modellkomplexität"
            copy: "Drei unabhängig geprüfte Indikatoren adressieren beide Kampagnen. Der Beitrag war nicht ein Modell, sondern die Prüfung der Datenbasis und die Einordnung, welcher Indikator trägt und welcher nicht."

